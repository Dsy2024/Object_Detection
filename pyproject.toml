[project]
name = "autoaudiogram"
version = "0.1.0"
description = "Audiogram detection, OCR, and patient record system"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "accelerate>=1.15.0",
    "easyocr>=1.7.2",
    "faker>=40.35.0",
    "gradio>=6.10.0",
    "numpy>=2.3,<2.4",
    "onnxruntime>=1.26.0",
    "opencc>=1.3.1",
    "opencv-python>=4.13.0.92",
    "paddleocr>=2.10.0",
    "paddlepaddle>=3.0.0",
    "pandas>=3.0.0",
    "pillow>=12.1.1",
    "pypdfium2>=5.0.0",
    "rapidocr>=3.8.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.13.0",
    "ultralytics>=8.4.31",
]